# chopin's single agent identity.
#
# This preset replaces the original four presets split by mission (root-cause / engineering /
# evolve / curate). They were merged not for convenience but because that split does not
# hold up unattended:
#
# 1. A mission had to be chosen by a person before startup and then locked for the whole
#    session. An agent on a long-running project that discovers "a capability is missing here"
#    halfway through could not switch from delivery to self-evolution; it had to stop and ask
#    for a restart, which is exactly what 24x7 operation must not need.
# 2. Discipline through tool isolation was fake. engineering had bash anyway: edit chopin's
#    source, pnpm build, and after hot reload the new code runs. Self-modification was always open.
# 3. The real carrier of discipline is the gate, and a gate checks "which tools you called",
#    not "which tools you have". Having bash does not get you through the "gathered first-hand
#    evidence" gate. So giving it every tool loosens the discipline not at all.
#
# Hence the shape: one identity, every tool, four submit tools each with its own gates. The
# kind of work done decides which submit tool delivers it, and the gates check the tool-call
# log by that work's standard.
#
# The cost, stated plainly: hot reload reaches the other sessions in the same process. When
# several lines of work run in parallel, one of them changing chopin affects the others
# already running. That is the price of "being able to repair itself halfway through".

- insert:
    - id: preset-chopin
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chopin
        name: chopin
        plugins:
          # ── Identity ────────────────────────────────────────────────────────────────────
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are chopin, an engineering agent powered by the {{model}} model, working in {{cwd}}.
                You carry a long-running project forward within the user's approved scope: pick approved work off the queue,
                find the structural cause before you change anything, make the smallest change that fixes it,
                and prove it works by running the project's own checks.
                Before starting a new substantial task, including a new feature, a multi-module change,
                or work with unresolved goals, scope or design decisions, call the skill tool with
                {"name":"grilling"}, the methodology behind grill-me, and follow its full instructions.
                Do not begin implementation until the user confirms shared understanding of the requirements.
                During grilling, ask one question at a time and wait for the answer. Do not dispatch subagents
                without explicit user approval; investigate facts yourself when delegation is not approved.
                These interaction constraints take precedence over the skill's round and delegation defaults.
                Continue previously clarified and approved work without repeating the interview unless its
                scope or requirements materially change. Trivial, well-specified edits and factual questions
                do not require this interview.
                Four submit tools exist, one per kind of work — submit_root_cause_report for an investigation,
                submit_delivery for a change to the project, submit_evolution for a change to chopin itself,
                submit_curation for a promotion shortlist. Use the one that matches what you actually did.
                Each has its own gates; gates read your tool-call log, not your claims, and name what is
                missing when they reject. When the work is blocked by something chopin lacks, extend chopin
                through submit_evolution rather than working around it by hand.
                Full experience blocks contain complete approved lessons: apply them only when their conditions fit,
                without calling experience_read again. Only index-only entries need experience_read before use.
                User instructions take precedence over every lesson.
                Loading and reading are exposure records, not proof of benefit. When the user
                corrects how you work, call evolution_correction_record right away with a slug, the lesson and
                the situation it applies to; managed lessons are saved automatically and available from the next step.
                After a real gated delivery, use the maintenance opportunity to save one reusable memory or skill with
                evolution_experience_record. Reuse existing slugs and update only what changed. Do not save ordinary chat,
                task transcripts, unverified guesses or secrets. Skip the review when nothing is reusable.
                Managed capabilities use host policy authorization, not simulated user approval. Code tools must use the
                learned_ namespace and stay within the sandbox interfaces; never rewrite host policies, evaluators or
                user-authored instructions to make a capability pass. Permission expansion still needs the user.
                Summarize actual saved, updated or disabled capabilities once; do not ask for routine maintenance confirmation.
                Improvement strategies can evolve: read with evolution_improver_read, propose with evolution_improver_propose,
                change the algorithm and stage normally. Preserve origin and contracts; budgets, evaluators and audit are not editable.
                Inspect actual experience selection with evolution_context_inspect; evolve its bounded policy with evolution_context_strategy.
                A CHOPIN EVOLUTION QUEUE may also appear: self-improvement work only you or the user can do.
                Do it when the project queue is drained or the user is not waiting on you; the host handles
                verification, installation, canary, activation and rollback by itself.
                Write everything you show the user in the language the user writes in. Keep identifiers, error strings,
                file paths, tool names, and command output verbatim in their original form.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # A file listed in CHOPIN_USER_INSTRUCTIONS must load or the step is refused; the default
          # global file is carried only when it exists.
          - id: personal-instructions
            name: '@chopin/evolution-runtime/instructions'
            config:
              files: !!js >-
                (() => {
                  const { join } = process.getBuiltinModule('node:path');
                  const { homedir } = process.getBuiltinModule('node:os');
                  const { existsSync } = process.getBuiltinModule('node:fs');
                  if (process.env.CHOPIN_USER_INSTRUCTIONS) return JSON.parse(process.env.CHOPIN_USER_INSTRUCTIONS);
                  const fallback = join(homedir(), '.claude', 'CLAUDE.md');
                  return existsSync(fallback) ? [fallback] : [];
                })()
              maxBytes: 65536

          - id: experience-commands
            name: '@chopin/evolution-runtime/commands'

          # Before every model step, approved experience is selected by structured trigger. Dynamic
          # content goes into the runtime-context snapshot, not the static system prompt: what this
          # round saw is auditable, and the stable prefix stays intact.
          - id: chopin-evolution-context
            name: '@chopin/evolution-runtime/context'

          # Extracts real tool/gate failures only from committed session events; never reads the
          # assistant's own account, never guesses a root cause, only appends observed evidence.
          - id: chopin-evolution-observer
            name: '@chopin/evolution-observer'

          - id: chopin-evolution-tools
            name: '@chopin/evolution-runtime/tools'

          - id: chopin-evolution-authoring
            name: '@chopin/evolution-authoring'

          # Loads only code capabilities approved by exact digest and whose lifecycle allows use by the current generation.
          - id: chopin-plugin-adapter
            name: '@chopin/plugin-adapter'

          # ── Methodology ──────────────────────────────────────────────────────────────────
          #
          # dsh ships two skills in its package: how to write a dynamic Cordis plugin, how to edit
          # a composition. The originals are the methodology authority, referenced rather than
          # copied: a copy would silently go stale after a dsh upgrade.
          #
          # The last directory is the `~/.claude` skill root, which dsh does not scan by default;
          # skills kept only there would otherwise be invisible. A missing directory is skipped.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js >-
                    (() => {
                      const { createRequire } = process.getBuiltinModule('node:module');
                      const { dirname, join } = process.getBuiltinModule('node:path');
                      const { realpathSync } = process.getBuiltinModule('node:fs');
                      return join(dirname(realpathSync(createRequire(baseUrl).resolve('@chopin/bundle/package.json'))), 'presets', 'chopin', 'skills');
                    })()
                - !!js >-
                    (() => {
                      const { createRequire } = process.getBuiltinModule('node:module');
                      const { dirname, join } = process.getBuiltinModule('node:path');
                      return join(dirname(createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills');
                    })()
                - !!js >-
                    (() => {
                      const { homedir } = process.getBuiltinModule('node:os');
                      const { join } = process.getBuiltinModule('node:path');
                      return process.env.CHOPIN_CLAUDE_SKILLS_DIR ?? join(homedir(), '.claude', 'skills');
                    })()

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── Read, write and execute ──────────────────────────────────────────────────────────────
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-str-replace-editor
            name: '@deepseek-ai/dsh-tool-str-replace-editor'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # ── Continuation ────────────────────────────────────────────────────────────────────
          #
          # The persona declares unattended operation, but some runtime component has to enforce
          # it: a round that produces no tool call ends, control returns to the user, and whether
          # the task is finished makes no difference.
          #
          # Only tool-goal needs adding here. goal (goal state and lifecycle) and goal-round-driver
          # (queues the next `<goal_round>` when the agent idles) come from dsh-base, enabled by
          # default and not disabled by the UI bundle; only the model-facing tool-goal is disabled.
          # With it added, the model can set its own goal, declare completion or report being blocked.
          #
          # goal registers the `goals` service and belongs to the host layer. Mounting it again in
          # the preset lands in the root realm, collides with the existing registration, and the
          # whole preset fails to mount.
          #
          # Division of labor with tool-ralph: ralph starts a fresh sub-agent every round and passes
          # only a handoff report, suited to very long tasks that would exhaust the context; goal
          # appends rounds within the same session, keeping context and tool results, suited to
          # long tasks worked item by item off a queue.
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── How to write a goal ──────────────────────────────────────────────────────────────
          #
          # Once a goal is marked complete its activation becomes disarmed at once and the driver
          # queues no further round. That is dsh's correct design: a reached goal should stop. But
          # it also means **how the goal is written decides how long the run lasts**.
          #
          # Writing the objective as a list of concrete actions ("migrate A, migrate B, migrate C")
          # sets your own finish line: once the three are done it is complete, disarmed, and stopped
          # in front of a person, even with ten more items in the queue.
          #
          # The right form is a standing mission plus a completion criterion, so that "is there
          # work left" is answered by the repository, not by the length of a list:
          #
          #   Advance the requirements in .agents/notes/proposed/ whose dependencies are met to
          #   implemented/ one by one; take candidates with work_queue at the start of every round,
          #   and count as done only when the queue has no CLAIMABLE item.
          #
          # work_queue is the companion tool: a requirement is claimable when its owner is empty
          # and every requirement it references has landed; it also reports dangling links, since
          # referencing a requirement that does not exist leaves its dependents waiting forever,
          # and reading the files by eye cannot catch that.

          # ── Self-reference ──────────────────────────────────────────────────────────────────
          #
          # Read-only queries of the running runtime's interface contracts; persistent changes can
          # only be files in the repository.
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'

          # ── Parallelism ────────────────────────────────────────────────────────────────────
          #
          # Running several things at once under one large project is the norm: one line reading
          # code, one reproducing, one digging through history. Each sub-agent has its own context
          # and the main agent receives only conclusions, never flooded with the intermediate steps.
          # `/mode ultra` is an explicit orchestration switch living only in the current session:
          # parent and child requests use max reasoning, the host starts 2-3 workers in parallel and
          # merges their results; standard adds no tools and no cost.
          - id: chopin-ultra-mode
            name: '@chopin/ultra-mode'
            config:
              stateDir: !!js >-
                process.env.CHOPIN_ULTRA_STATE_DIR ??
                process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.chopin', 'ultra-mode')
              # Any new custom delegation alias must be registered here too; Ultra removes these names from the root tool surface.
              delegationTools:
                - subagent
                - subagent_fork
                - subagent_claude_code
                - workflow
                - ralph
          #
          # Delegation goes into a group with isolate because workflowEngine is a service; tool-jobs
          # and subagent_fork are pure tools and stay at the top level. engineering used to mount
          # tool-subagent once at the top level and once in the group, and both registering
          # `subagent` collided; only the group copy is kept here.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # Orchestration scripts: split one job into a multi-stage fan-out, keeping intermediate
          # results in script variables rather than in the conversation.
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'

          # The right shape for long runs: every round starts a fresh sub-agent given only the
          # unchanging goal and the previous round's handoff report; the workspace is the long-term
          # memory. Round 40 is as clear-headed as round 1, because context never accumulates.
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            config:
              subagentProvider: spawn
              maxRounds: 64
              maxHandoffChars: 16384
              maxResultChars: 16384

          # ── Context compaction ──────────────────────────────────────────────────────────────
          #
          # Without compaction a long task hits the context limit halfway. Service rows must stay
          # in a group with an isolate realm, otherwise they land in the root realm and the second
          # session mounting the same preset collides.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── Target project verification tools ──────────────────────────────────────────────────────
          #
          # How the project runs tests and builds is configuration, not the model's guess. The
          # defaults follow pnpm conventions and fix the project in the current directory; if yours
          # differs, set CHOPIN_REPO_PATH / CHOPIN_TEST_COMMAND / CHOPIN_BUILD_COMMAND /
          # CHOPIN_LINT_COMMAND in ~/.dsh/.env.
          #
          # vars holds only project constants taken from environment variables: this preset is part
          # of chopin's generic layer and must carry no information about any specific project.
          - id: chopin-toolset
            name: '@chopin/toolset'
            config:
              toolsets:
                - engineering
                - github-and-code
              dirs:
                - !!js >-
                    (() => {
                      const { createRequire } = process.getBuiltinModule('node:module');
                      const { dirname, join } = process.getBuiltinModule('node:path');
                      const { realpathSync } = process.getBuiltinModule('node:fs');
                      return process.env.CHOPIN_TOOLSETS_DIR
                        ?? join(dirname(dirname(dirname(realpathSync(createRequire(baseUrl).resolve('@chopin/bundle/package.json'))))), 'toolsets');
                    })()
              vars:
                REPO_PATH: !!js process.env.CHOPIN_REPO_PATH ?? process.cwd()
                TEST_COMMAND: !!js process.env.CHOPIN_TEST_COMMAND ?? 'pnpm test'
                BUILD_COMMAND: !!js process.env.CHOPIN_BUILD_COMMAND ?? 'pnpm build'
                LINT_COMMAND: !!js process.env.CHOPIN_LINT_COMMAND ?? 'pnpm lint'
                GITHUB_REPO: !!js process.env.CHOPIN_GITHUB_REPO ?? ''

          # ── chopin's own verification tools ───────────────────────────────────────────────────
          #
          # A separate row because its REPO_PATH points at the chopin repo rather than the target
          # project, derived from the bundle package's location. The package is linked into the
          # profile, so realpath is needed to get back to the repo.
          #
          # Its git tools are named chopin_git_diff / chopin_git_status, distinct from the target
          # project's git_diff / git_status: they look at different repositories, a shared name
          # would collide, and the gates would judge the wrong one.
          - id: chopin-toolset-self
            name: '@chopin/toolset'
            config:
              toolsets:
                - chopin-self
              dirs:
                - !!js >-
                    (() => {
                      const { createRequire } = process.getBuiltinModule('node:module');
                      const { dirname, join } = process.getBuiltinModule('node:path');
                      const { realpathSync } = process.getBuiltinModule('node:fs');
                      return join(dirname(dirname(dirname(realpathSync(createRequire(baseUrl).resolve('@chopin/bundle/package.json'))))), 'toolsets');
                    })()
              vars:
                REPO_PATH: !!js >-
                  (() => {
                    const { createRequire } = process.getBuiltinModule('node:module');
                    const { dirname } = process.getBuiltinModule('node:path');
                    const { realpathSync } = process.getBuiltinModule('node:fs');
                    return dirname(dirname(dirname(realpathSync(createRequire(baseUrl).resolve('@chopin/bundle/package.json')))));
                  })()

          # ── Triage ────────────────────────────────────────────────────────────────────
          #
          # Finds "what is worth investigating". Zero LLM throughout: sources are pulled concurrently,
          # clustered by normalized error string, ranked by occurrence count and impact, and only
          # what clears the bar goes to investigation.
          - id: chopin-tool-signal
            name: '@chopin/signal/tool'

          # ── Evidence ────────────────────────────────────────────────────────────────────
          #
          # Evidence bundle download and extraction, trace parsing. Native tools rather than
          # declarative YAML: chained history reconstruction, the meaning of truncation markers and
          # cache path derivation cannot be expressed as shell templates.
          - id: chopin-evidence
            name: '@chopin/evidence'

          # ── Session signals and the pending area ────────────────────────────────────────────────────────
          #
          # session_signals is deterministic: redaction, merging near-duplicates by normalized key,
          # counting across sessions. The model never reads raw logs: hundreds of thousands of lines
          # are too low in value density, and they contain credentials.
          - id: chopin-tool-session
            name: '@chopin/tool-session'

          # ── Ledger ────────────────────────────────────────────────────────────────────
          #
          # Search and write both live in this package. Writes (ledger_write) go through dsh's
          # approval seam and ask a person every time; unattended there is nobody to ask, ask
          # degrades to a rejection on its own, and that is exactly the direction wanted.
          #
          # ledger_write stamps the promotion timestamp itself: the write was approved by a person,
          # so a "promoted" state cannot appear out of nowhere. Lessons that land as gates or tools
          # bypass the ledger and are closed with curation_pending_settle.
          - id: tool-ledger
            name: '@chopin/tool-ledger'

          # ── Team mode, the lead's side ────────────────────────────────────────────────────────
          #
          # Submit a batch after interviewing the person, have them approve it once its acceptance
          # checks exist, relay their decisions and confirm landed work. The team's state rides in
          # every request, so a fresh session picks up where the last one stopped. Workers run under
          # this same preset; the host refuses them these tools.
          - id: chopin-team-lead
            name: '@chopin/team-runtime/lead'
            config:
              requiredSkills: ['grilling', 'grill-me']

          # ── Output and discipline ──────────────────────────────────────────────────────────────
          #
          # Four submit tools coexist, each with its own gates. Guards register by the name of the
          # tool they guard and do not interfere: filing a root-cause report means passing the four
          # evidence gates, delivering a change means passing the three verification gates.
          #
          # The agent judges what kind of work it did and picks the submit tool itself; this is
          # where discipline lands after the merge: no longer "you only have these tools" but "to
          # deliver this kind of thing you must have done these things first".

          # Investigation: produces conclusions, not changes.
          - id: chopin-report-root-cause
            name: '@chopin/report'
            config:
              tool:
                name: submit_root_cause_report
                description: >-
                  File the finished root-cause analysis. Rejected unless the investigation gates are satisfied;
                  the rejection names what is missing.
                parameters:
                  type: object
                  additionalProperties: false
                  required:
                    - problem
                    - trigger
                    - rootCause
                    - anchoredTag
                    - impact
                    - fixProposal
                    - risks
                    - inferences
                  properties:
                    problem:
                      type: string
                      description: What the user experienced, in the user's own words.
                    trigger:
                      type: string
                      description: What set this particular occurrence off. Distinct from the root cause.
                    rootCause:
                      type: string
                      description: >-
                        The structural defect that turns the trigger into user-visible damage.
                        A trigger restated is not a root cause.
                    anchoredTag:
                      type: string
                      description: The release tag the code was read at — the version the user actually ran.
                    recurrenceHistory:
                      type: string
                      description: >-
                        Prior occurrences and why the earlier fixes did not reach the root.
                        Empty only when the ledger and issue history both came back clean.
                    impact:
                      type: string
                      description: Affected users and frequency, as observed across sources.
                    fixProposal:
                      type: string
                      description: The fix in behavioral terms — what stops being possible once it lands.
                    risks:
                      type: string
                      description: What the fix could break.
                    inferences:
                      type: array
                      items:
                        type: string
                      description: Every claim that is inference rather than verified fact.
              gates:
                - id: recurrence-ledger
                  description: >-
                    Search the defect ledger first (ledger_search). Recurring N times means the previous
                    N-1 fixes were at the wrong layer, which changes what counts as a root cause here.
                  satisfiedByTools:
                    - ledger_search
                - id: recurrence-history
                  description: >-
                    Search prior reports by ERROR STRING, not by symptom wording — closed ones included.
                  satisfiedByTools:
                    - issue_history_search
                - id: first-hand-evidence
                  description: >-
                    Read first-hand evidence (log bundle / trace / logs). The report text and bot conclusions
                    are claims about the evidence, not the evidence.
                  satisfiedByTools:
                    - bundle_fetch
                    - trace_list_runs
                    - log_grep
                - id: version-anchored
                  description: >-
                    Read the code at the release the user actually ran (repo_show_at_tag). Code on the
                    main branch is not evidence about a released build.
                  satisfiedByTools:
                    - repo_show_at_tag

          # Delivery: changes the target project.
          - id: chopin-report-delivery
            name: '@chopin/report'
            config:
              tool:
                name: submit_delivery
                description: >-
                  File the finished change. Rejected unless the delivery gates are satisfied;
                  the rejection names what is missing.
                parameters:
                  type: object
                  additionalProperties: false
                  required:
                    - summary
                    - rootCause
                    - verification
                    - risks
                    - inferences
                  properties:
                    summary:
                      type: string
                      description: What changed, in behavioral terms — what stops being possible now.
                    rootCause:
                      type: string
                      description: >-
                        The structural cause this change addresses. If the change only suppresses a
                        symptom, say so plainly here instead of dressing it up as a root-cause fix.
                    verification:
                      type: string
                      description: >-
                        Which checks were run and what they reported. Name the tools and the outcome;
                        "should work" is not verification.
                    outOfScope:
                      type: string
                      description: >-
                        Anything the full diff touches beyond the stated goal, and why. Empty when the
                        diff contains nothing but the intended change.
                    risks:
                      type: string
                      description: What this change could break.
                    inferences:
                      type: array
                      items:
                        type: string
                      description: Every claim that is inference rather than something a check confirmed.
              gates:
                - id: verified
                  description: >-
                    Run the project's own checks (run_tests / run_build / run_lint). Claiming the change
                    works does not count; running them does.
                  satisfiedByTools:
                    - run_tests
                    - run_build
                    - run_lint
                - id: diff-reviewed
                  description: >-
                    Read the complete diff (git_diff) before delivering. It is the only view that shows
                    what you touched BESIDES what you meant to touch.
                  satisfiedByTools:
                    - git_diff
                - id: recurrence-ledger
                  description: >-
                    Search the ledger (ledger_search) before delivering. If this defect was fixed before,
                    the earlier fix was at the wrong layer and this one probably is too.
                  satisfiedByTools:
                    - ledger_search

          # Self-evolution: changes chopin itself.
          - id: chopin-report-evolution
            name: '@chopin/report'
            config:
              tool:
                name: submit_evolution
                description: >-
                  File the finished change to chopin itself. Rejected unless the evolution gates are
                  satisfied; the rejection names what is missing.
                parameters:
                  type: object
                  additionalProperties: false
                  required:
                    - capability
                    - reason
                    - trialRun
                    - verification
                    - risks
                    - inferences
                  properties:
                    capability:
                      type: string
                      description: >-
                        What chopin can now do that it could not before — a tool, a gate rule, a plugin.
                        Name the files that carry it.
                    reason:
                      type: string
                      description: >-
                        What made this necessary. Cite the ledger record, the observed recurrence, or the
                        concrete blocker that stopped work; a capability with nothing behind it is speculation.
                    trialRun:
                      type: string
                      description: >-
                        What chopin_smoke reported when the whole composition was mounted in a real
                        profile — whether the preset mounted and which tools it checked.
                    verification:
                      type: string
                      description: >-
                        Which chopin checks were run and what they reported. Name the tools and the outcome.
                    outOfScope:
                      type: string
                      description: >-
                        Anything the full diff touches beyond the stated capability, and why. Empty when
                        the diff contains nothing but the intended change.
                    risks:
                      type: string
                      description: >-
                        What this could break — including which running sessions pick up the change, since
                        hot reload reaches every session in the process.
                    inferences:
                      type: array
                      items:
                        type: string
                      description: Every claim that is inference rather than something a check confirmed.
              gates:
                # Accepts only cordis_inspect_query, not cordis_inspect_list: listing answers "what
                # exists", only the contract answers "how to write it", and a gate the weaker call can
                # satisfy is hollow.
                - id: inspected
                  description: >-
                    Query the live contract (cordis_inspect_query) before writing plugin code — listing the
                    providers is not enough. Listing answers "what exists"; only a query answers "how to
                    write it": the Builtin provider says which globals the sandbox exposes (there is no
                    process, so a plugin cannot read the filesystem), and the Tool provider says what
                    defineTool accepts. Learning these from error messages costs a define+run round trip each.
                  satisfiedByTools:
                    - cordis_inspect_query
                - id: trial-run
                  description: >-
                    Mount the whole composition in a real profile (chopin_smoke) after building. A plugin
                    that was never mounted is a guess about the runtime.
                  satisfiedByTools:
                    - chopin_smoke
                - id: verified
                  description: >-
                    Run chopin's own tests (chopin_test). The gate contract is what everything else
                    rests on; a change that was never tested against it is not delivered.
                  satisfiedByTools:
                    - chopin_test
                - id: composition-checked
                  description: >-
                    Run the composition check (chopin_check_composition). A preset row that does not
                    resolve, or a gate naming a tool nothing provides, deadlocks startup.
                  satisfiedByTools:
                    - chopin_check_composition
                - id: diff-reviewed
                  description: >-
                    Read the complete diff of chopin's own repository (chopin_git_diff) before delivering.
                    It is the only view that shows what you touched BESIDES what you meant to touch.
                  satisfiedByTools:
                    - chopin_git_diff

          # Curation: turns recurring problems into experience candidates.
          - id: chopin-report-curation
            name: '@chopin/report'
            config:
              tool:
                name: submit_curation
                description: >-
                  File the promotion shortlist. Rejected unless the curation gates are satisfied;
                  the rejection names what is missing.
                parameters:
                  type: object
                  additionalProperties: false
                  required:
                    - reviewed
                    - notWorking
                    - recorded
                    - shortlist
                    - discarded
                    - inferences
                  properties:
                    reviewed:
                      type: string
                      description: What was read — how many sessions, over what window, how many signals came back.
                    recorded:
                      type: string
                      description: Which candidates went into the pending area, by id, and why each one earned a place.
                    shortlist:
                      type: string
                      description: >-
                        What the user should promote now, most-supported first. For each: the lesson in behavioral
                        terms, how many distinct sessions back it, and the proposed shape (ledger record / gate rule
                        / declarative tool).
                    notWorking:
                      type: string
                      description: >-
                        What curation_review reported: which already-promoted lessons kept failing anyway, how many
                        times, and what that says about where the real fix belongs. Say so plainly when there is
                        nothing promoted yet.
                    discarded:
                      type: string
                      description: >-
                        What was seen and deliberately NOT recorded, and which reason applied — generic hygiene,
                        one-off, or already encoded. This is the part that keeps the shortlist trustworthy.
                    risks:
                      type: string
                      description: >-
                        Where promoting one of these could go wrong — a gate nothing can satisfy, a rule that
                        fights an existing one.
                    inferences:
                      type: array
                      items:
                        type: string
                      description: >-
                        Every claim that is inference rather than something the signals or the ledger confirmed.
              gates:
                - id: read-signals
                  description: >-
                    Read the session signals (session_signals). A curation pass that never looked at the logs is
                    guesswork about what went wrong.
                  satisfiedByTools:
                    - session_signals
                - id: reviewed-promoted
                  description: >-
                    Score the already-promoted lessons (curation_review) before proposing new ones. A curation pass
                    that only ever adds is not learning — it never finds out that a lesson it promoted last month is
                    being ignored or was fixed at the wrong layer, and that is the finding worth the most.
                  satisfiedByTools:
                    - curation_review
                - id: checked-pending
                  description: >-
                    List the pending area (curation_pending_list) before recording. Without it one lesson accumulates
                    under several ids and the shortlist stops being a shortlist.
                  satisfiedByTools:
                    - curation_pending_list
                - id: checked-ledger
                  description: >-
                    Search the ledger (ledger_search) for the signals you are about to record. A signal that matches
                    a record already fixed once is a recurrence — that is the most valuable candidate there is, and
                    it reads completely differently from a first sighting.
                  satisfiedByTools:
                    - ledger_search
