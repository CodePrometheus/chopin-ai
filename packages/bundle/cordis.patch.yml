# chopin bundle: the host layer stacked on top of dsh-base.
#
# Only **process-level** things live here: services and cross-session registries. Tools
# facing the model, identity and gate rules belong to the agent plane, in each mission's preset.
#
# The split is not a matter of style: a service row in a preset lands in the root realm,
# the second session mounting the same preset collides, and dsh rejects it at mount time.
# Conversely, a tool registered at the host layer is visible to every mission, and the
# missions are no longer isolated from each other.

- insert:
    # The gate registry. The guard registers from the plain context, so it covers every tool
    # call of every agent; the rules themselves come per mission from each preset's
    # chopin-report rows.
    - id: chopin-gates
      name: '@chopin/gate'

    - id: chopin-session-integrity
      name: '@chopin/evolution-runtime/integrity'

    - id: chopin-rsi-executor
      name: '@chopin/cli/rsi-host'

    # The conclusion ledger. A process-level, cross-session resource: the recurrence history
    # one mission finds must be visible to another, or "remembering" degrades into every kind
    # of task keeping its own.
    - id: chopin-ledger
      name: '@chopin/ledger'
      config:
        dir: !!js process.env.CHOPIN_LEDGER_DIR ?? process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.chopin', 'ledger')

    # Host state of the Experience-to-Plugin RSI: the JSONL is authoritative, the artifact
    # directory is content-hash addressed. The agent plane only mounts the dynamic context
    # adapter and never recreates this cross-session service.
    - id: chopin-evolution
      name: '@chopin/evolution-runtime'
      config:
        eventsFile: !!js process.env.CHOPIN_EVOLUTION_EVENTS ?? process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.chopin', 'evolution', 'events.jsonl')
        artifactsDir: !!js process.env.CHOPIN_EVOLUTION_ARTIFACTS ?? process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.chopin', 'evolution', 'artifacts')
        receiptsDir: !!js process.env.CHOPIN_EVOLUTION_RECEIPTS ?? process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.chopin', 'evolution', 'receipts')
        chopinVersion: '0.1.0'
        processGeneration: !!js process.env.CHOPIN_PROCESS_GENERATION ?? process.getBuiltinModule('node:crypto').randomUUID()
        maxIndexItems: 200
        maxIndexChars: 25000
        maxBodyChars: 16000
        autonomous: true
        maxMaintenanceCalls: 8

    # Triage. The SeenStore records "what was seen across rounds"; two sessions each keeping
    # their own would investigate the same signal twice, so it must be process-level.
    - id: chopin-signals
      name: '@chopin/signal'
      config:
        sourcesFile: !!js process.env.CHOPIN_SOURCES_FILE ?? ''
        seenFile: !!js process.env.CHOPIN_SEEN_FILE ?? process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.chopin', 'seen.json')

    # Stop MemOS logging to the terminal. Its logger is a module-level singleton whose default
    # always writes INFO to stdout, and the config-reading initLogger is never called in
    # embedded mode, so the TUI drowns. This row calls it once on its behalf; logs go back to
    # MemOS's own logs/.
    - id: chopin-memos-quiet
      name: '@chopin/memos-quiet'

    # Notify at the end of a round. Unattended operation presumes nobody watches the terminal,
    # yet when dsh finishes a round it just hands control back to the prompt, silently; a
    # person could only keep watching or come back to peek on a timer.
    - id: chopin-notify
      name: '@chopin/notify'

    # Retry known transient tool failures automatically. Some failures have nothing to do with
    # the call and pass on rerun, but unattended they count as the command really failing, and
    # judgement then rests on a false premise.
    - id: chopin-retry
      name: '@chopin/retry'

# Default model switched to Claude. base defaults to deepseek-v4-flash, which the UI uses
# unless a model is picked by hand; chopin's playbooks are written for Claude, so the default
# must match.
# This overrides the base row as a whole (the patch replaces the entire config); it is not an insert.
- id: agent-default-model
  config:
    provider: anthropic
    model: claude-opus-5

# The engines for parallelism and long runs. dsh-TUI disables these rows: it moved the model
# tools wholesale into its own preset system and switched the engines off along with them.
# chopin re-enables them on top: an engine is a cross-session host resource and belongs on;
# the model-facing tools are not here but handed to each mission's own preset.
- id: workflow-ptc
  disabled: false
  config:
    provider: spawn

- insert:
    # Host-level query providers for the runtime interface; cordis_inspect_query relies on them
    # to answer the Builtin and Tool contracts. The web UI bundle ships this row, the terminal
    # one does not; it is process-global and a duplicate mount is rejected, so it is added only
    # when the web UI bundle is not loaded.
    - id: chopin-cordis-inspect-providers
      name: '@deepseek-ai/dsh-tool-cordis/host'
      disabled: !!js "ctx.get('profileContext')?.startedBundles.includes('@deepseek-ai/dsh-web-app') !== false"

- insert:
    # Scheduling. Work like triage and inspection runs on its own clock with nobody watching:
    # the time base of 24x7 operation. It installs tools per session (schedule_create / list / delete)
    # and needs the persistence service, all of which dsh-base already provides.
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
