[package]
name = "chopin-job-broker"
description = "Durable command admission and original-operation reconciliation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
transport = ["dep:axum", "dep:reqwest"]
worker = ["dep:async-io", "dep:command-fds", "dep:nix", "dep:rustix", "dep:sha2", "dep:libseccomp", "sqlx/sqlite"]

[dependencies]
axum = { workspace = true, optional = true }
url.workspace = true
reqwest = { workspace = true, optional = true }
async-trait.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
subtle.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
async-io = { workspace = true, optional = true }
libseccomp = { workspace = true, optional = true }
command-fds = { workspace = true, optional = true }
nix = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[[bin]]
name = "chopin-job-gate"
path = "src/bin/gate.rs"
required-features = ["worker"]

[[bin]]
name = "chopin-job-capture"
path = "src/bin/capture.rs"
required-features = ["worker"]

[dev-dependencies]
futures-util.workspace = true
rcgen.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
tower.workspace = true

[lints]
workspace = true
