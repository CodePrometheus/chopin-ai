# One-shot deployment generation reconciler: starts no model, creates no session. The controller
# phase mounts no adapter by default; code loading is enabled explicitly only once the supervisor
# has confirmed a dsh-plugin request.
- id: logger-console
  name: '@deepseek-ai/cordis-plugin-logger-console'
  config:
    colors: false
    levels:
      default: 2
    showTime: ''

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: chopin-evolution
  name: '@chopin/evolution-runtime'
  config:
    eventsFile: !!js process.env.CHOPIN_EVOLUTION_EVENTS ?? process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.chopin', 'evolution', 'events.jsonl')
    artifactsDir: !!js process.env.CHOPIN_EVOLUTION_ARTIFACTS ?? process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.chopin', 'evolution', 'artifacts')
    receiptsDir: !!js process.env.CHOPIN_EVOLUTION_RECEIPTS ?? process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.chopin', 'evolution', 'receipts')
    chopinVersion: '0.1.0'
    processGeneration: !!js process.env.CHOPIN_PROCESS_GENERATION
    autonomous: false
    maxIndexItems: 200
    maxIndexChars: 25000
    maxBodyChars: 1500

- id: chopin-plugin-adapter
  name: '@chopin/plugin-adapter'
  disabled: !!js process.env.CHOPIN_EVOLUTION_LOAD_CODE !== '1'
  config:
    mode: controller
