- id: logger-console
  name: '@deepseek-ai/cordis-plugin-logger-console'
  config:
    colors: false
    levels:
      default: 2
    showTime: ''

- id: mock-llm
  name: './evolution-mock-llm.ts'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: 'Exercise a learned capability.'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents:
      - id: main
        provider: chopin-evolution-mock
        model: chopin-evolution-mock
        cwd: !!js process.cwd()

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: chopin-evolution
  name: '@chopin/evolution-runtime'
  config:
    eventsFile: './.evolution/events.jsonl'
    artifactsDir: './.evolution/artifacts'
    receiptsDir: './.evolution/receipts'
    chopinVersion: '0.1.0'
    dshVersion: '0.1.3-alpha.1'
    processGeneration: 'e2e-generation'
    maxIndexItems: 200
    maxIndexChars: 25000
    maxBodyChars: 1500

- id: chopin-plugin-adapter
  name: '@chopin/plugin-adapter'

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: 'none'

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
