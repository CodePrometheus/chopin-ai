- id: logger-console
  name: '@deepseek-ai/cordis-plugin-logger-console'
  config:
    colors: false
    levels:
      default: 2
    showTime: ''

- id: mock-llm
  name: './ultra-mock-llm.ts'

- id: commands
  name: '@deepseek-ai/dsh-commands'

- id: subagents
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: ultra-mode
  name: '@chopin/ultra-mode'
  config:
    stateDir: !!js process.getBuiltinModule('node:path').join(process.cwd(), '.ultra-state')

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: 'Exercise parallel execution.'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents:
      - id: main
        provider: chopin-ultra-initial
        model: initial-model
        cwd: !!js process.cwd()

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: 'none'

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
