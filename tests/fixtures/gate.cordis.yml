# Test-only composition: runs chopin's gates through a real agent loop.
# The chopin rows load build artifacts, the same files loaded in deployment, so build before running.
- id: logger-console
  name: '@deepseek-ai/cordis-plugin-logger-console'
  config:
    colors: false
    levels:
      default: 2
    showTime: ''

- id: mock-llm
  name: './mock-llm.ts'

- id: chopin-gates
  name: '@chopin/gate'

- id: chopin-ledger
  name: '@chopin/ledger'
  config:
    # Points at a directory that does not exist: the search returns nothing, but the call succeeds.
    # Exactly what proves the gate counts "searched", not "found".
    dir: './.ledger-empty'

- id: chopin-tool-ledger
  name: '@chopin/tool-ledger'

- id: chopin-report
  name: '@chopin/report'
  config:
    tool:
      name: submit_report
      description: File the finished analysis.
      parameters:
        type: object
        additionalProperties: false
        required:
          - problem
          - rootCause
        properties:
          problem:
            type: string
          rootCause:
            type: string
    gates:
      - id: recurrence-ledger
        description: Search the defect ledger first.
        satisfiedByTools:
          - ledger_search

# A second submit exit whose gate names a tool no plugin provides: it can never be satisfied.
# Such a configuration error must be stated outright, not show up as "the model is rejected however it tries".
- id: chopin-report-broken
  name: '@chopin/report'
  config:
    tool:
      name: submit_broken
      description: A submit tool whose gate can never be satisfied.
      parameters:
        type: object
        additionalProperties: false
        required:
          - problem
        properties:
          problem:
            type: string
    gates:
      - id: impossible
        description: Needs a tool nothing provides.
        satisfiedByTools:
          - nonexistent_tool

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: 'Exercise the investigation gates.'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents:
      - id: main
        provider: chopin-gate-mock
        model: chopin-gate-mock
        cwd: !!js process.cwd()

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: 'none'

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
