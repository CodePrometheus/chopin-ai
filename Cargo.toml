[workspace]
members = ["crates/protocol", "crates/job-broker"]
resolver = "3"

[workspace.package]
version = "0.7.0-rc1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/CodePrometheus/chopin-ai"

[workspace.dependencies]
async-trait = "0.1.92"
async-io = "2.6.0"
command-fds = "0.3.3"
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal"] }
rustix = { version = "1.1.6", features = ["process", "event", "fs", "pipe", "time"] }
sha2 = "0.11.1"
subtle = "2.6.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
url = "2.5.8"
tower = { version = "0.5.3", features = ["util"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
libseccomp = "0.4.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json"] }
zeroize = { version = "1.9.1", features = ["derive"] }
flate2 = "1.1.11"
futures-util = { version = "0.3.34", features = ["sink"] }
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "process", "io-util", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
webpki-roots = "1.0.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
